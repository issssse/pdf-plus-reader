[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mathpix-pdf-pipeline"
version = "0.4.0"
description = "Reproducible Mathpix PDF conversion experiments with multi-axis QA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "pypdf>=5",
  "rapidfuzz>=3.10",
  "requests>=2.31",
]

[project.urls]
Source = "https://github.com/issssse/pdf-plus-reader"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mathpix-pdf = "mathpix_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
